name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build with the pinned V toolchain
        # Same builder stage as the release, so CI tests the exact
        # compiler commit the release ships with.
        run: docker build --target builder -t v-http-apilab-builder .

      - name: Check formatting and vet
        run: |
          docker run --rm v-http-apilab-builder v fmt -verify src
          docker run --rm v-http-apilab-builder v vet src

      - name: Extract the binary
        run: |
          mkdir -p bin
          cid="$(docker create v-http-apilab-builder)"
          docker cp "${cid}":/out/v-http-apilab bin/v-http-apilab
          docker rm "${cid}" >/dev/null

      - name: Run the curl test suites
        run: make test
